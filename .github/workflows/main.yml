name: Native x64 release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trafficmonitor-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publication-language:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout candidate as data
        uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable trusted scanner
        uses: actions/checkout@v4
        with:
          ref: 5b859ee863e9334ff0c16465a0202ae6c12687d9
          path: trusted-scanner
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - name: Check publication language
        shell: pwsh
        env:
          PUBLICATION_LANGUAGE_DATA: ${{ secrets.PUBLICATION_LANGUAGE_DATA }}
          PUBLICATION_LANGUAGE_EXCEPTIONS: ${{ secrets.PUBLICATION_LANGUAGE_EXCEPTIONS }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TIP: ${{ github.sha }}
          EVENT_BASE: ${{ github.event.before }}
        run: |
          node -e "const {spawnSync}=require('node:child_process'); const path=require('node:path'); const fs=require('node:fs'); const os=require('node:os'); const input=process.env.PUBLICATION_LANGUAGE_DATA; const exceptions=process.env.PUBLICATION_LANGUAGE_EXCEPTIONS; delete process.env.PUBLICATION_LANGUAGE_DATA; delete process.env.PUBLICATION_LANGUAGE_EXCEPTIONS; if(!input||!exceptions){console.error('Publication rule or reviewed exception input missing; check incomplete.');process.exit(2)} const dir=fs.mkdtempSync(path.join(os.tmpdir(),'publication-policy-')); try{const file=path.join(dir,'exceptions.json'); fs.writeFileSync(file,exceptions,{mode:384}); const args=[path.resolve('trusted-scanner/scripts/publication/run-publication-language-ci.mjs'),'--root',path.resolve('candidate'),'--tip',process.env.EVENT_TIP,'--exceptions-file',file]; if(process.env.EVENT_NAME==='push'){args.push('--base',process.env.EVENT_BASE)}else{args.push('--mode','current-tree-only')} const result=spawnSync(process.execPath,args,{input,stdio:['pipe','inherit','inherit'],windowsHide:true});process.exitCode=result.status??2;}finally{fs.rmSync(dir,{recursive:true,force:true})}"
          if ($LASTEXITCODE -ne 0) { throw 'Publication language check failed or incomplete' }
  build-release:
    needs: publication-language
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record source and release version
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Publication requires main' }
          $version = "1.0.${{ github.run_number }}"
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version-run${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_ENV
          "WORKFLOW_STARTED=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
      - name: Build native x64
        shell: cmd
        run: build.bat /s
      - name: Build genuine unsigned Squirrel installer
        shell: cmd
        run: build-installer.bat -Version %PACKAGE_VERSION%
      - name: Publish normal source-bound release
        id: publish
        shell: pwsh
        run: |
          $sha = '${{ github.sha }}'
          git fetch origin main
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Source is not in main lineage' }
          $completed = [DateTime]::UtcNow
          $started = [DateTime]::Parse($env:WORKFLOW_STARTED).ToUniversalTime()
          $duration = ($completed - $started).ToString('hh\:mm\:ss')
          $body = "Native x64 Release (lite). Unsigned Squirrel.Windows installer with application-local CRT and MFC. Source: $sha`n`nWorkflow started: $($started.ToString('o'))`nWorkflow completed: $($completed.ToString('o'))`nWorkflow duration: $duration`n`nTiming is measured through publication preparation; final API publication completion is recorded in the workflow output. Dim-sum catalogue selection is unavailable in this build; version-only title used."
          $body | Set-Content artifacts/release-notes.md
          gh release create $env:RELEASE_TAG artifacts/releases/Setup.exe artifacts/releases/RELEASES artifacts/releases/*-full.nupkg artifacts/releases/SHA256SUMS.txt --target $sha --title "TrafficMonitor $env:PACKAGE_VERSION" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          $release = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease -or $release.assets.Count -lt 4) { throw 'Normal release asset verification failed' }
          $ref = gh api "repos/${{ github.repository }}/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($ref.object.type -ne 'commit' -or $ref.object.sha -ne $sha) { throw 'Release tag source binding failed' }
          $run = gh run view '${{ github.run_id }}' --json startedAt | ConvertFrom-Json
          $started = [DateTime]::Parse($run.startedAt).ToUniversalTime()
          $completed = [DateTime]::UtcNow
          $duration = ($completed - $started).ToString('hh\:mm\:ss')
          $body = "Native x64 Release (lite). Unsigned Squirrel.Windows installer with application-local CRT and MFC. Source: $sha`n`nWorkflow started: $($started.ToString('o'))`nWorkflow completed: $($completed.ToString('o'))`nWorkflow duration: $duration`n`nMeasured from the workflow run start through completed release publication and asset/source verification. Dim-sum catalogue selection is unavailable in this build; version-only title used."
          $body | Set-Content artifacts/release-notes.md
          gh release edit $env:RELEASE_TAG --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release timing update failed' }
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
      - name: Collect safe run context
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/logs | Out-Null
          @{runId='${{ github.run_id }}';sourceCommit='${{ github.sha }}';jobStatus='${{ job.status }}';runnerOS='${{ runner.os }}';runnerArch='${{ runner.arch }}'} | ConvertTo-Json | Set-Content artifacts/logs/run-context.json
      - name: Preserve safe outputs
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trafficmonitor-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/logs/*.log
            artifacts/logs/run-context.json
            artifacts/releases/*
          if-no-files-found: warn
          retention-days: 14
  documentation-build:
    needs: [publication-language, build-release]
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Bind documentation downloads to this run's verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-release.outputs.release_tag }}
        run: |
          if (!$env:RELEASE_TAG) { throw 'Verified release tag is unavailable' }
          $metadata = gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' --json tagName,isDraft,isPrerelease,targetCommitish,publishedAt,url,assets
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata readback failed' }
          $release = $metadata | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease -or $release.tagName -ne $env:RELEASE_TAG -or $release.targetCommitish -ne '${{ github.sha }}') { throw 'Documentation release source does not match this run' }
          $expected = @('Setup.exe','RELEASES','SHA256SUMS.txt')
          foreach ($name in $expected) {
            if (@($release.assets | Where-Object name -eq $name).Count -ne 1) { throw 'Required download asset is missing or ambiguous' }
          }
          if (@($release.assets | Where-Object name -like '*-full.nupkg').Count -ne 1) { throw 'Full package download is missing or ambiguous' }
          $metadata | Set-Content -Encoding utf8 docs/release-metadata.json
      - name: Build portable offline documentation companion
        shell: cmd
        run: call build-installer.bat --docs-companion -Version 1.0.${{ github.run_number }}
      - name: Attach documentation companion to this run's normal release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build-release.outputs.release_tag }}
        run: |
          $release = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.isPrerelease -or $release.targetCommitish -ne '${{ github.sha }}') { throw 'Companion release source binding failed' }
          $manifest = Get-Content artifacts/docs-companion/documentation-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -ne '${{ github.sha }}') { throw 'Companion source differs from release source' }
          $names = @($manifest.file, 'documentation-manifest.json', 'offline-inventory.json', 'documentation-SHA256SUMS.txt')
          foreach ($name in $names) {
            if (@($release.assets | Where-Object name -eq $name).Count -ne 0) { throw 'Companion asset already exists; immutable assets are never overwritten' }
            $file = Join-Path artifacts/docs-companion $name
            if (!(Test-Path -LiteralPath $file)) { throw 'Companion asset missing' }
          }
          $exe = Join-Path artifacts/docs-companion $manifest.file
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw 'Companion output hash mismatch' }
          gh release upload $env:RELEASE_TAG $exe artifacts/docs-companion/documentation-manifest.json artifacts/docs-companion/offline-inventory.json artifacts/docs-companion/documentation-SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Companion upload failed' }
          $stored = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $stored.isDraft -or $stored.isPrerelease) { throw 'Normal release readback failed' }
          foreach ($name in $names) {
            $asset = @($stored.assets | Where-Object name -eq $name)
            if ($asset.Count -ne 1 -or $asset[0].size -ne (Get-Item (Join-Path artifacts/docs-companion $name)).Length) { throw 'Companion asset readback differs' }
          }
      - name: Preserve safe companion outputs
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trafficmonitor-documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/docs-companion/*.exe
            artifacts/docs-companion/*.json
            artifacts/docs-companion/*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve deployable documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist
  documentation-deploy:
    needs: documentation-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed documentation output
        id: deployment
        uses: actions/deploy-pages@v4
