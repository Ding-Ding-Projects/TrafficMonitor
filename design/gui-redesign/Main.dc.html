<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taskbar strip and context menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D5FD1}a:hover{color:#164AA6}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; position: relative; overflow: hidden; background: #DCE3EA; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: #111820">
  <div style="position: absolute; left: 48px; top: 40px; display: flex; flex-direction: column; gap: 6px; max-width: 520px">
    <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Taskbar strip</h1>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #46525F">Right-click anywhere on the strip opens the searchable menu above it, anchored to the cursor and kept inside the work area.</p>
  </div>

  <div style="position: absolute; right: 196px; bottom: 60px; width: 380px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D3DAE2; border-radius: 12px; box-shadow: 0 12px 32px rgba(17,24,32,0.18), 0 2px 6px rgba(17,24,32,0.10); padding: 8px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; gap: 8px; align-items: center; padding: 4px">
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 40px; box-sizing: border-box; padding: 0 12px; background: #F1F4F7; border: 1px solid #C9D2DC; border-radius: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="text" placeholder="Search menu" aria-label="Search menu" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 14px; color: #111820; outline: none">
      </label>
      <button type="button" style="height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: #E3ECFB; color: #164AA6; font: inherit; font-size: 13px; font-weight: 600">.*</button>
    </div>

    <div style="padding: 8px 12px 4px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; color: #5A6673">NETWORK</div>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: #E3ECFB; color: #111820; font: inherit; font-size: 14px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D5FD1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5 13a10 10 0 0 1 14 0"></path><path d="M8.5 16.5a5 5 0 0 1 7 0"></path><circle cx="12" cy="20" r="1"></circle></svg>
      <span style="flex: 1">Select connection</span>
      <span style="font-size: 12px; color: #46525F">Auto</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #111820; font: inherit; font-size: 14px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 10h8M8 14h5"></path></svg>
      <span style="flex: 1">Connection details</span>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #111820; font: inherit; font-size: 14px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 19V5"></path><path d="M4 19h16"></path><path d="M8 15l3-4 3 2 4-6"></path></svg>
      <span style="flex: 1">Traffic history</span>
    </button>

    <div style="height: 1px; background: #E2E7ED; margin: 4px 8px"></div>
    <div style="padding: 4px 12px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; color: #5A6673">WINDOWS</div>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #111820; font: inherit; font-size: 14px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18"></path></svg>
      <span style="flex: 1">Show floating monitor</span>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #111820; font: inherit; font-size: 14px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 17h18"></path><path d="M6 21h12"></path><path d="M7 13l3-3 3 2 4-4"></path></svg>
      <span style="flex: 1">Taskbar display settings</span>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #111820; font: inherit; font-size: 14px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      <span style="flex: 1">Hide taskbar strip</span>
    </button>

    <div style="height: 1px; background: #E2E7ED; margin: 4px 8px"></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 0 4px">
      <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border: 0; border-radius: 8px; background: #F1F4F7; color: #111820; font: inherit; font-size: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg>
        <span>Task Manager</span>
      </button>
      <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border: 0; border-radius: 8px; background: #F1F4F7; color: #111820; font: inherit; font-size: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 3v4M15 3v4M7 7h10v5a5 5 0 0 1-10 0z"></path><path d="M12 17v4"></path></svg>
        <span>Plugins</span>
      </button>
      <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border: 0; border-radius: 8px; background: #F1F4F7; color: #111820; font: inherit; font-size: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"></path></svg>
        <span>Options</span>
      </button>
    </div>
    <div style="height: 1px; background: #E2E7ED; margin: 4px 8px"></div>
    <div style="display: flex; gap: 4px">
      <button type="button" style="flex: 1; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #111820; font: inherit; font-size: 14px; text-align: left">
        <span style="flex: 1">Help and updates</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#46525F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: #A3262F; font: inherit; font-size: 14px; font-weight: 600">Exit</button>
    </div>
    <div style="display: flex; gap: 16px; padding: 6px 12px 2px; font-size: 12px; color: #5A6673; border-top: 1px solid #E2E7ED">
      <span>Type to filter</span><span>Enter to run</span><span>Esc to close</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: rgba(243,246,249,0.96); border-top: 1px solid #C9D2DC; display: flex; align-items: center; padding: 0 12px; gap: 8px">
    <div style="flex: 1"></div>
    <div style="display: flex; gap: 6px" aria-hidden="true">
      <div style="width: 40px; height: 40px; border-radius: 6px; background: #E3E9EF"></div>
      <div style="width: 40px; height: 40px; border-radius: 6px; background: #E3E9EF"></div>
      <div style="width: 40px; height: 40px; border-radius: 6px; background: #E3E9EF"></div>
      <div style="width: 40px; height: 40px; border-radius: 6px; background: #E3E9EF"></div>
    </div>
    <div style="flex: 1"></div>
    <div style="display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 12px; border-radius: 8px; background: #E3ECFB; outline: 2px solid #1D5FD1; outline-offset: -2px; font-variant-numeric: tabular-nums">
      <div style="display: flex; flex-direction: column; font-size: 12px; line-height: 16px">
        <span style="display: flex; gap: 6px; align-items: center"><span style="color: #B4490F; font-weight: 700">↑</span><span style="min-width: 74px; text-align: right">128.4 KB/s</span></span>
        <span style="display: flex; gap: 6px; align-items: center"><span style="color: #1D5FD1; font-weight: 700">↓</span><span style="min-width: 74px; text-align: right">4.62 MB/s</span></span>
      </div>
      <svg width="54" height="24" viewBox="0 0 54 24" fill="none" aria-hidden="true"><path d="M0 20 L6 18 L12 19 L18 12 L24 14 L30 6 L36 9 L42 4 L48 8 L54 3" stroke="#1D5FD1" stroke-width="1.8" stroke-linejoin="round"></path><path d="M0 22 L6 21 L12 22 L18 20 L24 21 L30 19 L36 20 L42 18 L48 20 L54 19" stroke="#B4490F" stroke-width="1.5" stroke-linejoin="round"></path></svg>
      <div style="display: flex; flex-direction: column; font-size: 12px; line-height: 16px">
        <span>CPU <b style="font-weight: 600">23%</b></span>
        <span>RAM <b style="font-weight: 600">61%</b></span>
      </div>
    </div>
    <div style="font-size: 12px; line-height: 16px; text-align: right; padding: 0 8px; color: #111820">
      <div>8:10 PM</div><div>2026-10-30</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
