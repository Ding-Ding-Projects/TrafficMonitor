<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc"><title id="title">Minimum adapter details sheet</title><desc id="desc">Static native detail reference with stable fixture identity and bounded fields. No actual network information.</desc><rect width="720" height="540" fill="#EDF3F0"/><g font-family="Segoe UI, sans-serif" fill="#18201D"><text x="24" y="32" font-size="16">TrafficMonitor · Network</text><rect x="112" y="56" width="584" height="456" rx="28" fill="#F8FAF8" stroke="#6E7973"/><text x="136" y="92" font-size="22">Adapter details</text><text x="625" y="91" font-size="14">Close</text><text x="136" y="122" font-size="13">Example adapter A · Connected</text><rect x="136" y="140" width="536" height="44" rx="8" fill="#EDF3F0"/><text x="152" y="167" font-size="13">Find property</text><text x="526" y="167" font-size="12">Clear   Regex</text><text x="136" y="215" font-size="12">IDENTITY</text><text x="136" y="244" font-size="14">GUID</text><text x="240" y="244" font-size="12">{00000000-0000-0000-0000-000000000001}</text><text x="136" y="276" font-size="14">Sample</text><text x="240" y="276" font-size="13">Sequence 120 · Fixture time 12:00:00 UTC</text><text x="136" y="308" font-size="14">Receiving</text><text x="240" y="308" font-size="13">12.4 MB/s · 1-second observation interval</text><text x="136" y="340" font-size="14">Sending</text><text x="240" y="340" font-size="13">860 KB/s · Per-adapter observation</text><text x="136" y="375" font-size="12">Addresses are private and excluded from this fixture.</text><text x="136" y="401" font-size="12">Selection changes the existing monitor scope, not history.</text><rect x="136" y="426" width="224" height="48" rx="24" fill="#006B5F"/><text x="164" y="455" font-size="14" fill="white">Use for monitor scope</text><text x="418" y="455" font-size="14">Export properties</text><text x="136" y="493" font-size="11">STATIC DESIGN REFERENCE · Synthetic fixture</text></g></svg>
