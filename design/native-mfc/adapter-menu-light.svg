<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc"><title id="title">Searchable native adapter context menu</title><desc id="desc">Static Material menu design with local command search, independent anchored regex workbench entry, matching results and keyboard shortcuts. Synthetic adapter.</desc><rect width="720" height="540" fill="#F8FAF8"/><g font-family="Segoe UI, sans-serif" fill="#18201D"><text x="24" y="36" font-size="20">Network · Example adapter A</text><rect x="24" y="68" width="672" height="64" rx="12" fill="#EDF3F0"/><text x="44" y="105" font-size="14">Example adapter A · Connected · 12.4 MB/s</text><rect x="320" y="148" width="376" height="340" rx="16" fill="#EDF3F0" stroke="#6E7973"/><rect x="336" y="164" width="344" height="48" rx="8" fill="#F8FAF8" stroke="#006B5F" stroke-width="2"/><text x="352" y="194" font-size="14">Search commands</text><text x="564" y="194" font-size="12">Clear</text><text x="618" y="194" font-size="12">Regex</text><text x="340" y="238" font-size="12">5 commands · This adapter</text><text x="344" y="278" font-size="14">Open details</text><text x="344" y="322" font-size="14">Use for monitor scope</text><text x="344" y="366" font-size="14">Export properties</text><text x="344" y="410" font-size="14">Edit appearance…</text><text x="344" y="454" font-size="14">Lock this element…</text><text x="24" y="184" font-size="13">Origin remains visible.</text><text x="24" y="210" font-size="13">Filter owns its regex state.</text><text x="24" y="236" font-size="13">Enter invokes the same command.</text><text x="24" y="262" font-size="13">Escape clears, then closes.</text><text x="24" y="518" font-size="11">STATIC DESIGN REFERENCE · No runtime proof · No shortcut shown without a registered binding</text></g></svg>
