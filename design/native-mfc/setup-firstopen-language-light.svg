<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc"><title id="title">First explicit dashboard open language setup</title><desc id="desc">Static first-open setup with three language choices and two independent message-style controls. No settings are applied by this drawing.</desc><rect width="720" height="540" fill="#F8FAF8"/><g font-family="Segoe UI, Microsoft JhengHei, sans-serif" fill="#18201D"><rect width="720" height="48" fill="#EDF3F0"/><text x="24" y="30" font-size="16">TrafficMonitor setup</text><text x="505" y="30" font-size="13">Accessibility</text><text x="650" y="30">Close</text><text x="32" y="88" font-size="24">Choose language and message style</text><text x="32" y="116" font-size="14">Step 1 of 4 · Monitoring continues in the taskbar</text><rect x="32" y="142" width="208" height="56" rx="28" fill="#9EF2DF"/><text x="56" y="176" font-size="15">● English</text><rect x="256" y="142" width="208" height="56" rx="28" fill="#EDF3F0"/><text x="280" y="176" font-size="15">○ 廣東話</text><rect x="480" y="142" width="208" height="56" rx="28" fill="#EDF3F0"/><text x="504" y="176" font-size="15">○ Bilingual · 雙語</text><text x="32" y="240" font-size="15">English message style</text><text x="560" y="240" font-size="14">5 · Playful</text><path d="M32 264H664" stroke="#006B5F" stroke-width="6"/><circle cx="664" cy="264" r="10" fill="#006B5F"/><text x="32" y="304" font-size="15">Cantonese message style</text><text x="560" y="304" font-size="14">5 · Playful</text><path d="M32 328H664" stroke="#006B5F" stroke-width="6"/><circle cx="664" cy="328" r="10" fill="#006B5F"/><text x="32" y="369" font-size="13">Both default to 5. Style affects every message, including warnings.</text><text x="32" y="393" font-size="13">Facts and consequences stay exact. Choose 1 for fully serious copy.</text><text x="32" y="425" font-size="12">Existing choices are loaded when available. Changes apply at Review.</text><text x="48" y="477" font-size="14">Save and close</text><rect x="526" y="446" width="162" height="48" rx="24" fill="#006B5F"/><text x="584" y="476" font-size="14" fill="white">Next</text><text x="32" y="522" font-size="11">STATIC DESIGN REFERENCE · Synthetic draft · No runtime proof</text></g></svg>
