<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc"><title id="title">First explicit dashboard open setup review</title><desc id="desc">Static resumable setup design, showing existing choices and an explicit Apply action. Not a running setup.</desc><rect width="720" height="540" fill="#F8FAF8"/><g font-family="Segoe UI, sans-serif" fill="#18201D"><rect width="720" height="48" fill="#EDF3F0"/><text x="24" y="30" font-size="16">TrafficMonitor setup</text><text x="505" y="30" font-size="13">Accessibility</text><text x="650" y="30">Close</text><text x="32" y="88" font-size="24">Review your choices</text><text x="32" y="116" font-size="14">Step 4 of 4 · Saved progress resumes here</text><text x="32" y="150" font-size="13">Language → Adapter → Startup and taskbar → Review</text><rect x="32" y="174" width="656" height="228" rx="16" fill="#EDF3F0"/><text x="52" y="206" font-size="15">Language</text><text x="320" y="206" font-size="15">English</text><text x="52" y="248" font-size="15">Monitor scope</text><text x="320" y="248" font-size="15">Automatic · Revalidate before apply</text><text x="52" y="290" font-size="15">Taskbar display</text><text x="320" y="290" font-size="15">Keep current: visible</text><text x="52" y="332" font-size="15">Login startup</text><text x="320" y="332" font-size="15">Keep current: disabled</text><text x="52" y="376" font-size="12">Existing settings are preserved unless explicitly changed.</text><text x="32" y="431" font-size="12">Apply verifies actual results. A failed step remains resumable.</text><text x="48" y="477" font-size="14">Back</text><text x="166" y="477" font-size="14">Save and close</text><rect x="526" y="446" width="162" height="48" rx="24" fill="#006B5F"/><text x="584" y="476" font-size="14" fill="white">Apply</text><text x="32" y="522" font-size="11">STATIC DESIGN REFERENCE · Illustrative saved draft · No runtime proof</text></g></svg>
